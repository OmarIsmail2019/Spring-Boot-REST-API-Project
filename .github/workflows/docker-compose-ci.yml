name: Docker Compose CI

on:
    push:
        branches:
            - main   
    pull_request:
        branches:
            - main 
jobs: 
    validate-clone:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: validate Docker Compose
              run: docker compose config
              
            - name: Build Docker image
              run: docker compose build
