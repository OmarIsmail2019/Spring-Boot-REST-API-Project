name: Docker Compose CI

on:
    push:
        branches:
            - main   
    pull_request:
        branches:
            - main 
jobs: 
    validate-clone:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: validate Docker Compose
              run: docker compose config
            - name: Login Docker Hub
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}   

            - name: Build Docker Image
              run: |
                docker tag spring_api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/spring_api:latest
                docker tag spring_api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/spring_api:${{ github.sha }}
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring_api:latest
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring_api:${{ github.sha }}



